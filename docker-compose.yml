# Local development stack: PostgreSQL + one-shot migrator + backend + MCP server.
# Reads secrets from .env (copy from .env.example). For local-only use.
#
# The backend refuses to start on an unmigrated schema, so `migrate` runs the
# production migrator once (exactly as the ECS deploy does) before it starts.
# The same server doubles as the test server:
#   TEST_POSTGRES_URL=postgres://gwj:gwj@127.0.0.1:5432/postgres bun run test
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gwj
      POSTGRES_PASSWORD: gwj
      POSTGRES_DB: gwj
    ports:
      - '5432:5432'
    volumes:
      - gwj_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gwj -d gwj']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      DATABASE_URL: postgres://gwj:gwj@postgres:5432/gwj
    command: ['bun', 'run', 'src/db/migrate.ts', '--target-database=gwj']
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgres://gwj:gwj@postgres:5432/gwj
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      CDN_BASE_URL: ${CDN_BASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    restart: unless-stopped
    ports:
      - '4100:4100'
    environment:
      MCP_PORT: 4100
      NODE_ENV: development
      MCP_TOKEN: ${MCP_TOKEN}
      API_BASE_URL: http://backend:4000
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - backend

volumes:
  gwj_postgres_data:
