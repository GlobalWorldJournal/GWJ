<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Establish connections to the media CDN and API early so the LCP hero image
         and the first data fetch don't wait on DNS+TLS handshakes. -->
    <link rel="preconnect" href="https://cdn.globalworldjournal.com" crossorigin />
    <link rel="preconnect" href="https://api.globalworldjournal.com" crossorigin />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Installable (home screen / app): name, icons and colours. No offline
         service worker: the news must be fresh. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="alternate" type="application/rss+xml" title="The Global World Journal" href="/feed.xml" />
    <title>The Global World Journal</title>
    <meta
      name="description"
      content="The Global World Journal — world, business, markets, tech, politics, opinion and arts. Breaking news and in-depth reporting."
    />
    <!-- Google AdSense: site ownership verification, plus the site-wide account
         script required before any ad unit (manual or Auto ads) can serve.
         Auto ads itself is toggled from the AdSense dashboard, not from code. -->
    <meta name="google-adsense-account" content="ca-pub-5040341565838705" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5040341565838705"
            crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
