name: Deploy AWS (backend + mcp)

# Builds linux/arm64 images for the backend and MCP server, pushes to ECR,
# syncs GitHub secrets to SSM (with placeholder guard), and forces a new ECS
# deployment. Requires infra created per docs/INFRA.md.

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'packages/mcp/**'
      - 'packages/shared-types/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC role assumption
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            ecr: ${{ vars.ECR_BACKEND }}
            service: ${{ vars.ECS_SERVICE_BACKEND }}
          - app: mcp
            ecr: ${{ vars.ECR_MCP }}
            service: ${{ vars.ECS_SERVICE_MCP }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.ecr }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.ecr }}:latest

      - name: Force new ECS deployment
        env:
          ECS_SERVICE: ${{ matrix.service }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
