name: Deploy AWS (backend + mcp)

# Builds linux/arm64 images for the backend and MCP server, pushes to ECR,
# syncs GitHub secrets to SSM (with placeholder guard), and forces a new ECS
# deployment. Requires infra created per docs/INFRA.md.

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'packages/mcp/**'
      - 'packages/shared-types/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC role assumption
  contents: read

# GWJ runs in its own isolated gwj-* resources on the Oxy AWS account. These are
# non-secret infrastructure identifiers (the OIDC role's trust policy — not this
# ARN — gates who may assume it), so they live in the workflow rather than repo
# variables, which keeps the deploy self-contained and reproducible.
env:
  AWS_REGION: us-west-2
  ECS_CLUSTER: oxy-cluster
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::237343248947:role/gwj-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            ecr: gwj-backend
            service: gwj-backend
          - app: mcp
            ecr: gwj-mcp
            service: gwj-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (for linux/arm64 build on the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.ecr }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.ecr }}:latest

      - name: Force new ECS deployment
        env:
          ECS_SERVICE: ${{ matrix.service }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
