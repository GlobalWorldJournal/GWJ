name: Deploy Cloudflare Pages (frontend)

# Builds the reader SPA + SEO worker and deploys it to Cloudflare Pages. Called by
# CI (ci.yml) only after every check passed on main; `workflow_dispatch` remains
# for operators.

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://globalworldjournal.com
  WRANGLER_VERSION: '4.130.0'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build frontend
        # Public build-time config (baked into the client bundle). Falls back to
        # the canonical API origin so the reader SPA never ships pointing at a
        # relative /api path (which would receive the SPA HTML and fail to parse).
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.globalworldjournal.com' }}
          # Media CDN (writer portraits).
          VITE_CDN_BASE_URL: ${{ vars.VITE_CDN_BASE_URL || 'https://cdn.globalworldjournal.com' }}
        run: bun run --filter '@gwj/frontend' build

      # Pinned wrangler run directly, not `cloudflare/wrangler-action`: the action
      # installs its own wrangler mid-deploy, and that install can fail and
      # publish nothing.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: bunx "wrangler@$WRANGLER_VERSION" pages deploy packages/frontend/dist --project-name=gwj --branch=main

      # The live page must reference the entry bundle this build produced (its
      # name is content-hashed), i.e. readers get THIS deploy, not a previous one.
      - name: Verify the new build is serving
        run: |
          entry="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' packages/frontend/dist/index.html | head -1)"
          test -n "$entry"
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "$SITE_URL/" | grep -qF "$entry"; then
              echo "serving $entry"
              exit 0
            fi
            echo "attempt $attempt/20: $SITE_URL does not reference $entry yet"
            sleep 6
          done
          echo "$SITE_URL never served $entry" >&2
          exit 1
