name: Deploy Cloudflare Pages (frontend)

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
      - 'packages/shared-types/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build frontend
        # Public build-time config (baked into the client bundle). Falls back to
        # the canonical API origin so the reader SPA never ships pointing at a
        # relative /api path (which would receive the SPA HTML and fail to parse).
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.globalworldjournal.com' }}
        run: bun run --filter '@gwj/frontend' build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/frontend/dist --project-name=gwj --branch=main
