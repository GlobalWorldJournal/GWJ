name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The backend and mongo-migration suites run against a REAL PostgreSQL (each
    # *.realdb.test.ts file creates, migrates and drops its own database). There
    # is no skip: without TEST_POSTGRES_URL those suites fail, by design.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gwj
          POSTGRES_PASSWORD: gwj
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwj"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_POSTGRES_URL: postgres://gwj:gwj@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # A lockfile out of sync with package.json fails the build: what CI tests
      # must be exactly what the Docker images install.
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The agent → MCP client → backend → DB → public API contract, end to end.
      - name: End-to-end contract
        run: bun run e2e

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Format
        run: terraform -chdir=infra fmt -check -recursive

      # Offline: no state, no AWS credentials. `plan`/`apply` stay manual.
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  # Builds the exact images deploy-aws.yml ships (same Dockerfiles, context and
  # platform), without pushing. The `check` job installs from the repo root where
  # every workspace exists; each Dockerfile copies its OWN subset of workspace
  # manifests before `bun install --frozen-lockfile`, so a manifest missing from
  # one Dockerfile fails only here — on the PR, not in the deploy.
  image-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, mcp]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64 build on the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (linux/arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}
