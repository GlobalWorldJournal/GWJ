name: CI

# Every push to main deploys — but only after every check below has passed: the
# deploy jobs at the bottom `need` them. Deploys always ship the whole of main
# (no path filtering), so a run that supersedes a queued one never leaves a
# change undeployed.

on:
  pull_request:
  push:
    branches: [main]

# main: runs queue in push order (deploys must not reorder); PRs: a new push
# cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # The backend and mongo-migration suites run against a REAL PostgreSQL (each
    # *.realdb.test.ts file creates, migrates and drops its own database). There
    # is no skip: without TEST_POSTGRES_URL those suites fail, by design.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gwj
          POSTGRES_PASSWORD: gwj
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwj"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_POSTGRES_URL: postgres://gwj:gwj@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A lockfile out of sync with package.json fails the build: what CI tests
      # must be exactly what the Docker images install.
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Formatting + lint in one read-only pass (fails on unformatted files and lint
      # errors), then the AGENTS.md bans Biome has no rule for.
      - name: Lint (Biome)
        run: bunx biome ci .

      - name: Banned patterns
        run: bun run scripts/check-banned.ts

      # The deploy runs these directly; a lost executable bit only fails there.
      - name: Shell scripts are executable
        run: |
          git ls-files -s -- 'scripts/*.sh' | awk '$1 != "100755" { print "not executable: " $4; bad = 1 } END { exit bad }'

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The agent → MCP client → backend → DB → public API contract, end to end.
      - name: End-to-end contract
        run: bun run e2e

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5

      - name: Format
        run: terraform -chdir=infra fmt -check -recursive

      # Offline: no state, no AWS credentials. `plan`/`apply` stay manual.
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  # Builds the exact images deploy-aws.yml ships (same Dockerfiles, context and
  # platform), without pushing. The `check` job installs from the repo root where
  # every workspace exists; each Dockerfile copies its OWN subset of workspace
  # manifests before `bun install --frozen-lockfile`, so a manifest missing from
  # one Dockerfile fails only here — on the PR, not in the deploy.
  image-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [backend, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (for linux/arm64 build on the amd64 runner)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/arm64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}

  deploy-aws:
    needs: [check, terraform, image-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # OIDC role assumption inside the called workflow
      contents: read
    uses: ./.github/workflows/deploy-aws.yml

  deploy-frontend:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-cloudflare.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
