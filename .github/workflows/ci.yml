name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The backend and mongo-migration suites run against a REAL PostgreSQL (each
    # *.realdb.test.ts file creates, migrates and drops its own database). There
    # is no skip: without TEST_POSTGRES_URL those suites fail, by design.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gwj
          POSTGRES_PASSWORD: gwj
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwj"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_POSTGRES_URL: postgres://gwj:gwj@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile, self-heal)
        run: |
          if ! bun install --frozen-lockfile; then
            echo "::warning::lockfile out of sync — regenerating"
            bun install
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
